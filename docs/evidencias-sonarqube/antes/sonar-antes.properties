# Propiedades del proyecto ANTES REPRODUCIDO de LabTrack.
# Uso previsto, desde la raíz del repositorio:
#   sonar-scanner -Dproject.settings=docs/evidencias-sonarqube/antes/sonar-antes.properties
# El token se pasa SIEMPRE por la variable de entorno SONAR_TOKEN o por -Dsonar.token
# en la línea de comandos; nunca se escribe en este archivo.
sonar.projectKey=labtrack-antes
sonar.projectName=LabTrack ANTES (reproducido)
sonar.projectVersion=1.0.0-antes-reproducido

sonar.sources=docs/evidencias-sonarqube/antes/src
sonar.sourceEncoding=UTF-8

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,**/test/**,**/e2e/**

# Memoria para el analizador de JavaScript/TypeScript
sonar.javascript.node.maxspace=4096
