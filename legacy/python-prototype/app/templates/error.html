{% extends "base.html" %}
{% block title %}{{ error_title }}{% endblock %}

{% block content %}
<section class="error-state">
  <span class="error-code">{{ error_code }}</span>
  <h1>{{ error_title }}</h1>
  <p>{{ error_message }}</p>
  <div class="error-actions">
    <a href="/" class="btn btn-primary">Ir al inicio</a>
    <a href="/login" class="btn btn-secondary">Iniciar sesión</a>
  </div>
</section>
{% endblock %}
