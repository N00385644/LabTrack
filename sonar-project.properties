# Propiedades del proyecto para SonarQube Community Build
sonar.projectKey=labtrack
sonar.projectName=LabTrack
sonar.projectVersion=1.0.0

sonar.sources=backend/src,frontend/src
sonar.sourceEncoding=UTF-8

# Exclusiones: dependencias, artefactos, pruebas y material de soporte
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts,backend/test/**,frontend/src/test/**,frontend/e2e/**,legacy/**,tools/**,instance/**,docs/**,jmeter/**

# Cobertura generada por Vitest (Istanbul/V8)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info

# Memoria para el analizador de JavaScript/TypeScript
sonar.javascript.node.maxspace=4096
